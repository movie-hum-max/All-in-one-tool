<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Online Tools Hub</title>

<!-- Paste your AdSense script here later -->

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
}

header{
  background:#000;
  padding:15px;
  text-align:center;
}

nav{
  display:flex;
  overflow:auto;
  background:#1b1b1b;
}

nav button{
  flex:1;
  padding:12px;
  border:none;
  background:#1b1b1b;
  color:white;
  cursor:pointer;
}

nav button:hover{
  background:#ff3d00;
}

.section{
  display:none;
  padding:20px;
  text-align:center;
}

input{
  padding:10px;
  margin:8px;
  width:200px;
  border-radius:6px;
  border:none;
}

button.action{
  background:#ff3d00;
  color:white;
  padding:10px 20px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.result{
  margin-top:15px;
  font-size:18px;
}

.ad{
  margin:20px;
  padding:15px;
  background:#222;
  text-align:center;
}

footer{
  background:#000;
  text-align:center;
  padding:10px;
}
</style>
</head>

<body>

<header>
  <h2> ALL IN ONE TOOL </h2>
</header>

<!-- Top Ad -->
<div class="ad">AdSense Banner (Top)</div>

<nav>
  <button onclick="show('age')">Age</button>
  <button onclick="show('bmi')">BMI</button>
  <button onclick="show('emi')">EMI</button>
  <button onclick="show('pdf')">Image → PDF</button>
  <button onclick="show('yt')">YouTube DL</button>
</nav>


<!-- AGE -->
<div id="age" class="section">
  <h3>🎂 Age Calculator</h3>
  <input type="date" id="dob">
  <br>
  <button class="action" onclick="calcAge()">Calculate</button>
  <div class="result" id="ageResult"></div>
</div>


<!-- BMI -->
<div id="bmi" class="section">
  <h3>💪 BMI Calculator</h3>
  <input type="number" id="weight" placeholder="Weight (kg)">
  <input type="number" id="height" placeholder="Height (cm)">
  <br>
  <button class="action" onclick="calcBMI()">Calculate</button>
  <div class="result" id="bmiResult"></div>
</div>


<!-- EMI -->
<div id="emi" class="section">
  <h3>🏦 Loan EMI Calculator</h3>
  <input type="number" id="loan" placeholder="Loan Amount">
  <input type="number" id="rate" placeholder="Interest %">
  <input type="number" id="months" placeholder="Months">
  <br>
  <button class="action" onclick="calcEMI()">Calculate</button>
  <div class="result" id="emiResult"></div>
</div>


<!-- Image to PDF -->
<div id="pdf" class="section">
  <h3>🖼 Image to PDF</h3>
  <input type="file" id="imgInput" accept="image/*">
  <br>
  <button class="action" onclick="toPDF()">Convert</button>
</div>


<!-- YouTube Downloader -->
<div id="yt" class="section">
  <h3>📥 YouTube Downloader</h3>
  <p>Paste YouTube link → open downloader</p>
  <input type="text" id="ytLink" placeholder="Paste YouTube URL">
  <br>
  <button class="action" onclick="ytDownload()">Download</button>
</div>


<!-- Bottom Ad -->
<div class="ad">AdSense Banner (Bottom)</div>

<footer>
© 2026 Tools Hub | Fast & Free
</footer>


<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

function show(id){
  document.querySelectorAll('.section').forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";
}

show('age');


// AGE
function calcAge(){
  let dob = new Date(document.getElementById("dob").value);
  let today = new Date();

  let y = today.getFullYear()-dob.getFullYear();
  let m = today.getMonth()-dob.getMonth();
  let d = today.getDate()-dob.getDate();

  if(d<0){m--; d+=30}
  if(m<0){y--; m+=12}

  ageResult.innerHTML = y+" Years "+m+" Months "+d+" Days";
}


// BMI
function calcBMI(){
  let w = weight.value;
  let h = height.value/100;
  let bmi = (w/(h*h)).toFixed(2);
  bmiResult.innerHTML = "BMI = "+bmi;
}


// EMI
function calcEMI(){
  let P=loan.value;
  let R=rate.value/12/100;
  let N=months.value;

  let emi=(P*R*Math.pow(1+R,N))/(Math.pow(1+R,N)-1);
  emiResult.innerHTML="Monthly EMI = ₹ "+emi.toFixed(2);
}


// Image → PDF
function toPDF(){
  const { jsPDF } = window.jspdf;
  let file = imgInput.files[0];
  let reader = new FileReader();

  reader.onload = function(){
    let pdf = new jsPDF();
    pdf.addImage(reader.result,'JPEG',10,10,180,160);
    pdf.save("converted.pdf");
  }

  reader.readAsDataURL(file);
}


// YouTube
function ytDownload(){
  let url = ytLink.value;
  window.open("https://en.savefrom.net/1-youtube-video-downloader-46/?url="+url);
}

</script>

</body>
</html>
